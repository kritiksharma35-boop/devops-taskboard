services:
  database:
    image: postgres:16-alpine
    container_name: taskboard-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: taskboard
      POSTGRES_USER: taskboard_user
      POSTGRES_PASSWORD: taskboard_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - taskboard-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U taskboard_user -d taskboard"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: taskboard-redis
    restart: unless-stopped
    networks:
      - taskboard-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: taskboard-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      DATABASE_URL: postgresql://taskboard_user:taskboard_password@database:5432/taskboard
      REDIS_URL: redis://redis:6379
    depends_on:
      database:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - taskboard-network

  frontend:
    build: ./frontend
    container_name: taskboard-frontend
    restart: unless-stopped
    depends_on:
      - backend
    networks:
      - taskboard-network

  nginx:
    image: nginx:alpine
    container_name: taskboard-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - taskboard-network

volumes:
  postgres_data:

networks:
  taskboard-network:
    driver: bridge
